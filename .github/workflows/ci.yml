name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      # One DSH release failing must not cancel the rest of the matrix.
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
        dsh: ['0.1.2-rc.1', '0.1.5-alpha.2', '0.1.5-rc.1']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # DSH packages currently require a newer npm resolver than the npm 11.3
      # bundled by some Node 24 images. Match the working community-plugin CI.
      - run: npm install --global npm@11.7.0
      # Pin EVERY @deepseek-ai package — direct and transitive — to the matrix
      # version, so the cell tests one complete isolated runtime closure.
      - run: node scripts/pin-dsh.mjs ${{ matrix.dsh }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npm run pack:check
